steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/cloud-run/frontend/Dockerfile
      - --build-arg
      - VITE_BACKEND_HTTP_URL=${_BACKEND_HTTP_URL}
      - --build-arg
      - VITE_BACKEND_WS_URL=${_BACKEND_WS_URL}
      - --build-arg
      - VITE_GRAFANA_BASE_URL=${_GRAFANA_BASE_URL}
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/brainbar/frontend
      - .
  # See backend/cloudbuild.yaml's comment on this same step: the images: field below
  # only pushes after the whole build succeeds, so without an explicit push here the
  # deploy step would always run one build behind.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/brainbar/frontend
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - brainbar-frontend
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/brainbar/frontend
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --max-instances=3
      - --cpu=1
      - --memory=256Mi
      - --concurrency=80
      - --quiet
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/brainbar/frontend
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _BACKEND_HTTP_URL: https://brainbar-backend-854441956422.us-central1.run.app
  _BACKEND_WS_URL: wss://brainbar-backend-854441956422.us-central1.run.app/stream
  _GRAFANA_BASE_URL: https://sincerechowder2500.grafana.net
